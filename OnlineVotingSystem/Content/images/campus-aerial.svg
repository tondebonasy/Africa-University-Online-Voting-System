    <pattern id="grass" width="70" height="70" patternUnits="userSpaceOnUse"><path d="m7 15 5-3m26 39 6-2m12-40 3-2" stroke="#b4b77c" stroke-opacity=".12" stroke-width="2"/></pattern>
