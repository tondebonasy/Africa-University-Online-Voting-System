<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Campus gardens from above</title>
  <desc id="desc">An original illustration of an imaginary campus, with terracotta roofs, green courtyards and warm evening light. It depicts no real university.</desc>
